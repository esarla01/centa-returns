name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: defect-tracker-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: centa
          POSTGRES_PASSWORD: centa
          POSTGRES_DB: centa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U centa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URI: postgresql+psycopg2://centa:centa@localhost:5432/centa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: defect-tracker-backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: defect-tracker-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: defect-tracker-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
